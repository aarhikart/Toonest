version: '3.8'

services:
  # 1. Next.js Web Application & API
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: toolnest-whatsapp-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://whatsapp_user:whatsapp_secure_pass@postgres:5432/whatsapp_marketing?schema=public
      - REDIS_URL=redis://redis:6379
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN}
      - WHATSAPP_API_VERSION=v21.0
      - WHATSAPP_API_BASE_URL=https://graph.facebook.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-default_super_secret_jwt_key_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 2. Background Queue Worker
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: toolnest-whatsapp-worker
    restart: unless-stopped
    command: ["node", "workers/campaignWorker.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://whatsapp_user:whatsapp_secure_pass@postgres:5432/whatsapp_marketing?schema=public
      - REDIS_URL=redis://redis:6379
      - META_APP_SECRET=${META_APP_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 3. PostgreSQL Database with persistence & health checks
  postgres:
    image: postgres:16-alpine
    container_name: toolnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatsapp_user
      POSTGRES_PASSWORD: whatsapp_secure_pass
      POSTGRES_DB: whatsapp_marketing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_user -d whatsapp_marketing"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Redis In-Memory Queue for Asynchronous Jobs
  redis:
    image: redis:7-alpine
    container_name: toolnest-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
